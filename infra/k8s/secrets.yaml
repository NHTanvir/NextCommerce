# NOTE: In production, use a secrets manager (AWS Secrets Manager, GCP Secret Manager)
# or sealed-secrets / external-secrets-operator. Do NOT commit real values here.
apiVersion: v1
kind: Secret
metadata:
  name: nextcommerce-secrets
  namespace: nextcommerce
type: Opaque
stringData:
  DATABASE_URL: "mysql://nextcommerce:changeme@mysql:3306/nextcommerce"
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET"
  STRIPE_SECRET_KEY: "REPLACE_WITH_STRIPE_KEY"
  STRIPE_WEBHOOK_SECRET: "REPLACE_WITH_WEBHOOK_SECRET"
  GOOGLE_CLIENT_ID: "REPLACE_WITH_GOOGLE_CLIENT_ID"
  GOOGLE_CLIENT_SECRET: "REPLACE_WITH_GOOGLE_CLIENT_SECRET"
  RABBITMQ_URL: "amqp://nextcommerce:changeme@rabbitmq:5672"
  REDIS_URL: "redis://redis:6379"
  SMTP_HOST: "smtp.sendgrid.net"
  SMTP_USER: "apikey"
  SMTP_PASS: "REPLACE_WITH_SENDGRID_KEY"

apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifications
  namespace: nextcommerce
  labels:
    app: notifications
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notifications
  template:
    metadata:
      labels:
        app: notifications
    spec:
      containers:
        - name: notifications
          image: nextcommerce/notifications:latest
          ports:
            - containerPort: 3002
          env:
            - name: NODE_ENV
              value: production
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: nextcommerce-secrets
                  key: RABBITMQ_URL
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi

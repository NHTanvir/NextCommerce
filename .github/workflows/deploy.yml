name: Deploy

# The public demo: the Next.js storefront and the read-only catalogue API,
# both on Cloudflare Workers. Pushing to master redeploys them.
#
# Needs CLOUDFLARE_API_TOKEN as a repository secret (Workers Scripts: Edit).
# Without it the jobs still build, and say what is missing instead of
# failing — a fork should not get a red tick for a deploy it cannot do.
on:
  push:
    branches: [master]
    paths:
      - 'apps/web/**'
      - 'packages/shared/**'
      - 'infra/demo-api/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  # Where the storefront's browser code looks for the catalogue. It is
  # inlined at build time, so it belongs to the build, not the runtime.
  DEMO_API_URL: https://nextcommerce-demo-api.naymul.workers.dev

jobs:
  demo-api:
    name: Deploy demo API
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check the worker bundles
        run: pnpm --filter @nextcommerce/demo-api exec wrangler deploy --dry-run

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm --filter @nextcommerce/demo-api exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Explain a skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set — built but not deployed."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  storefront:
    name: Deploy storefront
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: demo-api
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @nextcommerce/shared build

      # CF_WORKERS_BUILD drops Next's image optimizer, which has no sharp on
      # Workers, and the lint and typecheck build gates, which are their own
      # jobs in ci.yml.
      - name: Build for Workers
        working-directory: apps/web
        run: pnpm cf:build
        env:
          CF_WORKERS_BUILD: '1'
          NEXT_PUBLIC_API_URL: ${{ vars.DEMO_API_URL || env.DEMO_API_URL }}

      - name: Deploy
        if: env.CLOUDFLARE_API_TOKEN != ''
        working-directory: apps/web
        run: pnpm exec wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Explain a skipped deploy
        if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::warning::CLOUDFLARE_API_TOKEN is not set — built but not deployed."
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Check it answers
        if: env.CLOUDFLARE_API_TOKEN != ''
        run: |
          sleep 10
          curl -fsS -o /dev/null -w 'storefront %{http_code}\n' https://nextcommerce.naymul.workers.dev/
          curl -fsS https://nextcommerce-demo-api.naymul.workers.dev/api/health/live
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
